<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you! — Feelings & Friends</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F7EF;
    --paper:#FFFEF9;
    --ink:#3E3126;
    --ink-soft:#6B5C4D;
    --brown:#B4835A;
    --brown-deep:#8E6339;
    --pink:#F2B9C4;
    --yellow:#F6D077;
    --sky:#95D2E0;
    --sage:#A3C48F;
    --line:#E7E0CC;
    --shadow: 0 10px 30px rgba(62,49,38,.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 8% 12%, rgba(246,208,119,.35), transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(149,210,224,.3), transparent 40%),
      radial-gradient(circle at 50% 95%, rgba(163,196,143,.25), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Quicksand', sans-serif;
    line-height:1.55;
    padding:24px;
  }
  h1{font-family:'Baloo 2', sans-serif; font-weight:800; margin:0 0 10px; font-size:1.8rem;}
  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    max-width:460px;
    width:100%;
    padding:36px 32px;
    text-align:center;
  }
  .panel p{color:var(--ink-soft); margin:0 0 22px;}
  input[type=email]{
    width:100%;
    font-family:'Quicksand', sans-serif;
    font-size:1rem;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:12px;
    margin-bottom:14px;
    background:#fff;
    color:var(--ink);
  }
  input[type=email]:focus{outline:3px solid var(--sky); outline-offset:2px;}
  button{
    width:100%;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:#fff;
    background:var(--brown);
    border:none;
    border-radius:100px;
    padding:14px 20px;
    cursor:pointer;
    box-shadow:0 4px 0 var(--brown-deep);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  button:hover{transform:translateY(2px); box-shadow:0 2px 0 var(--brown-deep);}
  button:disabled{opacity:.6; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--brown-deep);}
  .status{margin-top:16px; font-size:.92rem; min-height:1.4em;}
  .status.error{color:#B3492E;}
  .status.ok{color:#3E7A44;}
  .status.pending{color:var(--ink-soft);}
  .icon{font-size:2.4rem; margin-bottom:6px;}
  .fine{font-size:.8rem; color:var(--ink-soft); margin-top:18px;}
  a{color:var(--brown-deep);}
</style>
</head>
<body>

<div class="panel">
  <div class="icon">🐾</div>
  <h1>Thanks for your order!</h1>
  <p id="lead">Enter the email you'd like your cards sent to, and we'll send both PDFs right away.</p>

  <form id="deliverForm">
    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
    <button type="submit" id="submitBtn">Send my cards</button>
  </form>

  <p class="status" id="status"></p>

  <p class="fine">Trouble? Email <strong>mrzahaki2@gmail.com</strong> with your payment confirmation and we'll send the deck manually.</p>
</div>

<script>
  // ⬇️ Your Apps Script Web App URL
  const DELIVERY_ENDPOINT = "https://script.google.com/macros/s/AKfycby5_PAtfnwHdzbsBTTqD_kZ98Ou8DzAgrQxJLdzr6iYCgEOIMtcAp6YGKln-eKvm585/exec";

  // NOWPayments may append the payment reference under different
  // parameter names depending on how the invoice/widget is configured.
  // We check every variant we've seen used and take the first match.
  function getPaymentId() {
    const params = new URLSearchParams(window.location.search);
    const candidates = ['payment_id', 'NP_id', 'np_id', 'pid', 'order_id', 'id'];
    for (const key of candidates) {
      if (params.get(key)) return params.get(key);
    }
    return null;
  }

  const paymentId = getPaymentId();
  const statusEl = document.getElementById('status');
  const leadEl = document.getElementById('lead');
  const form = document.getElementById('deliverForm');
  const btn = document.getElementById('submitBtn');

  if (!paymentId) {
    leadEl.textContent = "We couldn't find a payment reference in this link.";
    statusEl.className = 'status error';
    statusEl.textContent = "If you just paid, please email mrzahaki2@gmail.com with your payment confirmation and we'll send the deck manually.";
    form.style.display = 'none';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = 'Sending…';
    statusEl.className = 'status pending';
    statusEl.textContent = 'Confirming your payment, hang tight…';

    try {
      const resp = await fetch(DELIVERY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
        body: JSON.stringify({ email: email, payment_id: paymentId })
      });
      const data = await resp.json();

      if (data.ok) {
        statusEl.className = 'status ok';
        statusEl.textContent = "Sent! Check your inbox (and spam folder) for both PDFs.";
        btn.textContent = 'Sent ✓';
      } else {
        statusEl.className = 'status error';
        statusEl.textContent = data.error || 'Something went wrong. Please try again in a minute.';
        btn.disabled = false;
        btn.textContent = 'Send my cards';
      }
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = 'Network error — please try again, or email mrzahaki2@gmail.com directly.';
      btn.disabled = false;
      btn.textContent = 'Send my cards';
    }
  });
</script>

</body>
</html>
