  so they can't be templated client-side. Both need to be kept in sync
  by hand with apps-script-auth.gs (see that file's SETUP steps 7-8):

      and the matching SECRET key goes into apps-script-auth.gs.

<div class="auth-modal" id="authModal" aria-hidden="true">
  <div class="auth-modal-backdrop" id="authModalBackdrop"></div>
  <div class="auth-modal-panel" role="dialog" aria-modal="true" aria-label="Sign in or create an account">
    <button type="button" class="auth-modal-close" id="authModalClose" aria-label="Close">✕</button>

    <!--
      Google Identity Services' fully-declarative setup — no JS init call
      needed, it reads these data- attributes itself once gsi/client has
      loaded. data-client_id must match GOOGLE_CLIENT_ID in
      apps-script-auth.gs (see index.html's <head> comment).
    -->
    <div id="g_id_onload"
         data-client_id="1097376697543-jmnq0bnp3mfeef46r4jg84pi8hjcqf3i.apps.googleusercontent.com"
         data-callback="handleGoogleCredentialResponse"
         data-auto_prompt="false"></div>
    <!-- Rendered by account.js via google.accounts.id.renderButton() rather than
         the declarative data-width="320px" div, so the button's actual pixel
         width always matches this container (fixes overflow/horizontal-scroll
         on narrow phones and keeps it centered/resized on rotation or resize). -->
    <div class="google-signin-wrap">
      <div class="google-signin-container" id="googleSignInContainer"></div>
    </div>
    <p class="status-msg" id="googleAuthStatus"></p>

    <div class="auth-divider"><span id="authDividerText"></span></div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab" id="authTabLogin" data-mode="login"></button>
      <button type="button" class="auth-tab" id="authTabSignup" data-mode="signup"></button>
    </div>

    <form class="auth-pane" id="authPaneLogin" novalidate>
      <h3 id="authLoginTitle"></h3>
      <p class="auth-sub" id="authLoginSub"></p>

      <div class="field-group">
        <input type="email" id="loginEmail" name="email" class="email-input" autocomplete="email" inputmode="email" required>
        <p class="field-error" id="loginEmailError" aria-live="polite"></p>
      </div>
      <div class="field-group">
        <div class="password-field">
          <input type="password" id="loginPassword" name="current-password" class="email-input" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="toggleLoginPassword" data-target="loginPassword" aria-label="Show password">Show</button>
        </div>
        <p class="field-error" id="loginPasswordError" aria-live="polite"></p>
      </div>

      <!-- Honeypot: real visitors never see or fill this (off-screen, no
           label, tabindex -1, autocomplete off so browsers won't
           autofill it either). Simple scripted bots that fill every
           input on a form trip it; account.js checks it before ever
           calling the API, and apps-script-auth.gs checks it again
           server-side as the real enforcement point. -->
      <div class="hp-field" aria-hidden="true">
        <label for="loginHp">Leave this field empty</label>
        <input type="text" id="loginHp" name="company" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="loginSubmitBtn" class="pay-btn"></button>
      <p class="status-msg" id="loginStatus" aria-live="polite"></p>
      <button type="button" class="auth-resend-link" id="resendVerificationBtn" hidden></button>
      <p class="auth-switch"><span id="switchToSignupText"></span> <a href="#" id="switchToSignupLink"></a></p>
    </form>

    <form class="auth-pane" id="authPaneSignup" hidden novalidate>
      <h3 id="authSignupTitle"></h3>
      <p class="auth-sub" id="authSignupSub"></p>

      <div class="field-group">
        <input type="email" id="signupEmail" name="email" class="email-input" autocomplete="email" inputmode="email" required>
        <p class="field-error" id="signupEmailError" aria-live="polite"></p>
      </div>

      <div class="field-group">
        <div class="password-field">
          <input type="password" id="signupPassword" name="new-password" class="email-input" autocomplete="new-password" required minlength="8">
          <button type="button" class="toggle-password" id="toggleSignupPassword" data-target="signupPassword" aria-label="Show password">Show</button>
        </div>

        <!-- Strength meter + live requirements checklist — both driven
             by account.js on every keystroke, purely client-side UX.
             The real enforcement (length, blocklist, rate limits) still
             happens in apps-script-auth.gs. -->
        <div class="pw-strength" id="signupPwStrength" hidden>
          <div class="pw-strength-track"><div class="pw-strength-bar" id="signupPwStrengthBar"></div></div>
          <span class="pw-strength-label" id="signupPwStrengthLabel"></span>
        </div>
        <ul class="pw-checklist" id="signupPwChecklist">
          <li data-rule="len" id="ruleLen"></li>
          <li data-rule="variety" id="ruleVariety"></li>
        </ul>
        <p class="field-error" id="signupPasswordError" aria-live="polite"></p>
      </div>

      <div class="field-group">
        <div class="password-field">
          <input type="password" id="signupPasswordConfirm" name="new-password-confirm" class="email-input" autocomplete="new-password" required>
          <button type="button" class="toggle-password" id="toggleSignupPasswordConfirm" data-target="signupPasswordConfirm" aria-label="Show password">Show</button>
        </div>
        <p class="field-error" id="signupPasswordConfirmError" aria-live="polite"></p>
      </div>

      <div class="hp-field" aria-hidden="true">
        <label for="signupHp">Leave this field empty</label>
        <input type="text" id="signupHp" name="company" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="signupSubmitBtn" class="pay-btn"></button>
      <p class="status-msg" id="signupStatus" aria-live="polite"></p>
      <p class="auth-switch"><span id="switchToLoginText"></span> <a href="#" id="switchToLoginLink"></a></p>
    </form>

    <p class="recaptcha-notice" id="recaptchaNotice"></p>
  </div>
</div>

    <div class="support-panel-heading">
      <span class="support-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12.5C4 7.80558 7.94809 4 12.8125 4C17.6769 4 21.625 7.80558 21.625 12.5C21.625 17.1944 17.6769 21 12.8125 21C11.4076 21 10.0795 20.6857 8.90625 20.125L4.375 21.5L5.71875 17.4375C4.65029 16.0234 4 14.3391 4 12.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="support-avatar-dot" aria-hidden="true"></span>
      </span>
      <div>
        <h3 id="supportPanelTitle"></h3>
        <p class="support-panel-subtitle" id="supportPanelSubtitle"></p>
      </div>
    </div>
    <button type="button" class="support-close" id="supportClose" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="support-messages-wrap">
    <div class="support-messages" id="supportMessages" role="log" aria-live="polite" aria-relevant="additions"></div>
    <button type="button" class="support-scroll-latest" id="supportScrollLatest" hidden>
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 5V19M12 19L6 13M12 19L18 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="supportScrollLatestLabel">New messages</span>
    </button>
  </div>

  <div class="support-quick-replies" id="supportQuickReplies" hidden></div>

  <form class="support-form" id="supportForm">
    <label class="visually-hidden" for="supportInput">Message to support</label>
    <div class="support-input-wrap">
      <textarea id="supportInput" class="support-input" rows="1" required></textarea>
      <span class="support-char-count" id="supportCharCount" hidden></span>
    </div>
    <button type="submit" id="supportSendBtn" class="support-send" aria-label="Send message">
      <svg class="support-send-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 12L19.5 4.5L15 19.5L11 13L4.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="support-send-label" id="supportSendLabel"></span>
    </button>
  </form>
  <p class="status-msg support-status" id="supportStatus" role="status"></p>
</div>

<!-- config.js must load first: main.js, render.js, account.js and story.js all read window.SITE_CONFIG.
     account.js loads before main.js because main.js's checkout button calls into it (Account.getToken()/onChange).
     support.js loads after account.js for the same reason (Account.isLoggedIn()/onChange/getToken/getEmail). -->
<script src="config.js"></script>
<script src="js/render.js"></script>
<script src="js/account.js"></script>
<script src="js/main.js"></script>
<script src="js/story.js"></script>
<script src="js/support.js"></script>
</body>
</html>
