<!--

  social-preview bots read these before any JS runs, so they can't be

  two <script type="application/ld+json"> blocks below.
  Everything else on the page is rendered from config.js by render.js.
-->

<script type="application/ld+json">

  "url": "https://zahak.me/feelings-cards/",
  "brand": { "@type": "Brand", "name": "Feelings & Friends" },
  "category": "Printable educational card game",
  "offers": {
    "@type": "Offer",
    "price": "9.99",
    "priceCurrency": "USD",
    "availability": "https://schema.org/InStock",
    "url": "https://zahak.me/feelings-cards/",
    "itemCondition": "https://schema.org/NewCondition"
  }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What do I get when I buy the Feelings & Friends card deck?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "You receive two printable PDF files: a 30-page version with 2 cards per page (saves paper) and a 60-page version with 1 card per page (bigger cards, easier to cut out). Both cover the same 60 animal emotion cards."
      }
    },
    {
      "@type": "Question",
      "name": "How is the deck delivered after payment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Delivery is automatic after a confirmed crypto payment. If it doesn't arrive, emailing your payment confirmation gets it sent manually within a short time."
      }
    },
    {
      "@type": "Question",
      "name": "What payment methods are accepted?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Cryptocurrency payments are accepted, including Bitcoin, Monero, Ethereum, and 300+ other coins via NOWPayments."
      }
    }
  ]
}
</script>

<section class="story story--top" id="our-story">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow" id="storyEyebrow"></span>
      <h2 id="storyHeading"></h2>
      <p class="story-lede" id="storyLede"></p>
    </div>
  </div>

  <!-- Sits outside .wrap on purpose: lets the stage run wider than the
       1040px text column above, without ever bleeding to the raw viewport
       edge (see .storybook width in CSS). -->
  <div class="storybook reveal" id="storybookRoot">
    <div class="storybook-frame" id="storyFrame" tabindex="0" role="group" aria-roledescription="carousel" aria-label="Our story">
      <div class="storybook-stage" id="storyStage" style="--idx:0;">
        <!-- chapter <article> scenes injected by story.js from config.js -->
      </div>

      <button type="button" class="story-arrow story-prev" id="storyPrev" aria-label="Previous chapter" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" class="story-arrow story-next" id="storyNext" aria-label="Next chapter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>

      <button type="button" class="story-expand" id="storyExpand" aria-label="Open widescreen story view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>
      </button>

      <div class="story-hint" id="storyHint" aria-hidden="true">
        <span>Swipe</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>

    <div class="storybook-controls" id="storybookControls">
      <div class="story-toolbar">
        <button type="button" class="story-playtoggle" id="storyPlayToggle" aria-label="Pause story autoplay" aria-pressed="false"></button>
        <div class="story-track" id="storyDots" role="tablist" aria-label="Story chapters"><!-- injected --></div>
        <span class="story-count" id="storyCount" aria-hidden="true"></span>
      </div>
      <a href="#checkout" class="story-skip" id="storySkip"></a>
    </div>
  </div>
</section>

<!-- Widescreen story popup: the .storybook node above is moved in here
     on open (same elements, same IDs — no logic duplicated) and moved
     back to its original spot on close. -->
<div class="story-modal" id="storyModal" aria-hidden="true">
  <div class="story-modal-backdrop" id="storyModalBackdrop"></div>
  <div class="story-modal-panel" role="dialog" aria-modal="true" aria-label="Our story, widescreen view">
    <button type="button" class="story-modal-close" id="storyModalClose" aria-label="Close widescreen view">✕</button>
    <div class="story-modal-slot" id="storyModalSlot"></div>
  </div>
</div>

<section class="gallery" id="gallery">
  <div class="wrap">
    <div class="section-head reveal">
      <h2 id="galleryHeading"></h2>
      <p id="gallerySub"></p>
    </div>

    <div class="card-grid" id="cardGrid">
      <!-- thumbs injected by JS -->
    </div>

    <p class="gallery-more" id="galleryMore"></p>
  </div>
</section>

<section class="wheel-section" id="feelings-wheel">
  <div class="wrap">
    <div class="section-head reveal">
      <span class="eyebrow" id="wheelEyebrow"></span>
      <h2 id="wheelHeading"></h2>
      <p id="wheelSub"></p>
    </div>

    <div class="wheel-stage reveal">
      <div class="wheel-ring" id="wheelRing">
        <div class="wheel-hub" id="wheelHub">
          <span class="hub-num"></span>
          <span class="hub-label"></span>
        </div>
        <!-- petals injected by JS -->
      </div>

      <div class="wheel-detail" id="wheelDetail">
        <div class="wheel-hint" id="wheelHint"></div>
      </div>
    </div>
  </div>
</section>

<section class="about">
  <div class="wrap">

</section>

</section>


<section class="checkout" id="checkout">
  <div class="wrap">
    <div class="checkout-panel reveal">
      <h2 id="checkoutHeading"></h2>
      <p class="format-note" id="checkoutFormatNote"></p>
      <input type="email" id="buyerEmail" class="email-input" placeholder="you@example.com" required autocomplete="email">

      <div class="coin-row" id="coinRow"><!-- injected --></div>
      <p class="fallback-note" id="fallbackNote"></p>
    </div>
  </div>
</section>

<footer>
  <p id="footerDelivery"></p>
  <p class="footer-note" id="footerNote"></p>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Card preview">
  <div class="lightbox-panel">
    <button class="lb-close" id="lbClose" aria-label="Close preview">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous card">←</button>
    <img id="lbImg" src="" alt="">
    <p class="lightbox-caption" id="lbCaption"></p>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next card">→</button>
  </div>
</div>
